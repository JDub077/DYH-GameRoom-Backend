name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying Backend ==="

            # Ensure deployment directory exists
            mkdir -p ~/dyh/backend

            # Clone or pull backend repo
            if [ ! -d ~/dyh/backend/.git ]; then
              git clone ${{ github.server_url }}/${{ github.repository }}.git ~/dyh/backend
            fi

            cd ~/dyh/backend
            git fetch origin
            git reset --hard origin/main

            # Write .env if secret provided
            if [ -n "${{ secrets.BACKEND_ENV }}" ]; then
              echo "${{ secrets.BACKEND_ENV }}" > .env
            fi

            # Return to compose root and rebuild backend
            cd ~/dyh
            docker-compose pull
            docker-compose up -d --build backend

            # Cleanup
            docker system prune -f

            echo "=== Backend Deployed ==="
